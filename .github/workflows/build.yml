name: Build Windows executable

on:
  release:
    types: [published]   # build and attach AutoClicker.exe to every new release
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: write        # needed to upload assets to the release

jobs:
  build:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
          cache: pip

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt pyinstaller==6.22.3

      # --onefile:   single portable .exe, no install needed
      # --windowed:  no console window behind the GUI
      # --optimize 2: strip asserts and docstrings from bundled bytecode
      # --noupx:     UPX compression triggers far more antivirus false positives
      # pynput picks its OS backend at runtime, so PyInstaller cannot see it
      # and it must be listed explicitly or the exe crashes on start.
      - name: Build executable
        run: >
          pyinstaller --noconfirm --clean --onefile --windowed
          --name AutoClicker
          --optimize 2
          --noupx
          --hidden-import pynput.keyboard._win32
          --hidden-import pynput.mouse._win32
          gui.py

      - name: Smoke test (exe starts and stays running)
        shell: pwsh
        run: |
          $p = Start-Process -FilePath dist\AutoClicker.exe -PassThru
          Start-Sleep -Seconds 8
          if ($p.HasExited) { throw "AutoClicker.exe exited early with code $($p.ExitCode)" }
          Stop-Process -Id $p.Id -Force

      - name: Write SHA-256 checksum
        shell: pwsh
        run: |
          $hash = (Get-FileHash dist\AutoClicker.exe -Algorithm SHA256).Hash.ToLower()
          "$hash  AutoClicker.exe" | Out-File -Encoding ascii dist\AutoClicker.exe.sha256

      - uses: actions/upload-artifact@v4
        with:
          name: AutoClicker-windows
          path: |
            dist/AutoClicker.exe
            dist/AutoClicker.exe.sha256

      - name: Attach to release
        if: github.event_name == 'release'
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh release upload "${{ github.event.release.tag_name }}" dist/AutoClicker.exe dist/AutoClicker.exe.sha256 --clobber
