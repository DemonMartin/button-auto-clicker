name: Build executables

on:
  release:
    types: [published]   # build and attach the binaries to every new release
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: write        # needed to upload assets to the release

jobs:
  windows:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
          cache: pip

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt pyinstaller==6.22.3

      # --onefile:   single portable .exe, no install needed
      # --windowed:  no console window behind the GUI
      # --optimize 2: strip asserts and docstrings from bundled bytecode
      # --noupx:     UPX compression triggers far more antivirus false positives
      # pynput picks its OS backend at runtime, so PyInstaller cannot see it
      # and it must be listed explicitly or the exe crashes on start.
      - name: Build executable
        run: >
          pyinstaller --noconfirm --clean --onefile --windowed
          --name AutoClicker
          --optimize 2
          --noupx
          --hidden-import pynput.keyboard._win32
          --hidden-import pynput.mouse._win32
          gui.py

      - name: Smoke test (exe starts and stays running)
        shell: pwsh
        run: |
          $p = Start-Process -FilePath dist\AutoClicker.exe -PassThru
          Start-Sleep -Seconds 8
          if ($p.HasExited) { throw "AutoClicker.exe exited early with code $($p.ExitCode)" }
          Stop-Process -Id $p.Id -Force

      - name: Write SHA-256 checksum
        shell: pwsh
        run: |
          $hash = (Get-FileHash dist\AutoClicker.exe -Algorithm SHA256).Hash.ToLower()
          "$hash  AutoClicker.exe" | Out-File -Encoding ascii dist\AutoClicker.exe.sha256

      - uses: actions/upload-artifact@v4
        with:
          name: AutoClicker-windows
          path: |
            dist/AutoClicker.exe
            dist/AutoClicker.exe.sha256

      - name: Attach to release
        if: github.event_name == 'release'
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh release upload "${{ github.event.release.tag_name }}" dist/AutoClicker.exe dist/AutoClicker.exe.sha256 --clobber

  macos:
    strategy:
      fail-fast: false
      matrix:
        include:
          - runner: macos-latest      # Apple Silicon
            arch: arm64
          - runner: macos-15-intel    # Intel
            arch: x86_64
    runs-on: ${{ matrix.runner }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
          cache: pip

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt pyinstaller==6.22.3

      # On macOS a windowed build is an .app bundle (one-file .app is deprecated).
      - name: Build app bundle
        run: >
          pyinstaller --noconfirm --clean --windowed
          --name AutoClicker
          --osx-bundle-identifier io.github.demonmartin.autoclicker
          --optimize 2
          --noupx
          --hidden-import pynput.keyboard._darwin
          --hidden-import pynput.mouse._darwin
          gui.py

      - name: Smoke test (app starts and stays running)
        run: |
          dist/AutoClicker.app/Contents/MacOS/AutoClicker &
          pid=$!
          sleep 10
          if ! kill -0 "$pid" 2>/dev/null; then wait "$pid"; echo "App exited early (code $?)"; exit 1; fi
          kill "$pid"

      - name: Zip app and write SHA-256 checksum
        run: |
          zip_name="AutoClicker-macOS-${{ matrix.arch }}.zip"
          ditto -c -k --sequesterRsrc --keepParent dist/AutoClicker.app "dist/$zip_name"
          (cd dist && shasum -a 256 "$zip_name" > "$zip_name.sha256")
          echo "ZIP_NAME=$zip_name" >> "$GITHUB_ENV"

      - uses: actions/upload-artifact@v4
        with:
          name: AutoClicker-macOS-${{ matrix.arch }}
          path: |
            dist/${{ env.ZIP_NAME }}
            dist/${{ env.ZIP_NAME }}.sha256

      - name: Attach to release
        if: github.event_name == 'release'
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh release upload "${{ github.event.release.tag_name }}" "dist/$ZIP_NAME" "dist/$ZIP_NAME.sha256" --clobber
